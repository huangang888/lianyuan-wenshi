<script>

let DATA = [];
// ===== 按需加载机制（改造 2026-09-30）=====
let __lwLoaded = 0, __lwDone = false, __lwPromise = null;
const __lwTotal = 49;
function lwSeq(items, conc, fn) {
  let idx = 0;
  const workers = Array.from({ length: Math.min(conc, items.length) }, async function () {
    while (idx < items.length) { const cur = items[idx++]; await fn(cur); }
  });
  return Promise.all(workers);
}
function lwStatus() {
  var el = document.getElementById('status');
  if (el) el.textContent = '正在加载资料库 ' + __lwLoaded + '/' + __lwTotal + ' 本…';
}
function loadAllBooks() {
  if (__lwPromise) return __lwPromise;
  __lwPromise = (async function () {
    var items = []; for (var i = 1; i <= __lwTotal; i++) items.push(i);
    await lwSeq(items, 6, async function (i) {
      try {
        var r = await fetch('data/book_' + i + '.json', { cache: 'force-cache' });
        if (!r.ok) return;
        var arr = await r.json();
        if (arr && arr[0]) window.KNOWLEDGE_DATA.push(arr[0]);  // DATA 与 KNOWLEDGE_DATA 同引用
      } catch (e) {}
      __lwLoaded++; lwStatus();
    });
    __lwDone = true;
    lwStatus();
  })();
  return __lwPromise;
}
async function ensureData() { await loadAllBooks(); }


let lastKw = '';

let lastSummaryPlain = '';



// ===== API Key / 历史 存储键 =====

var LS_KEY = 'lianyuan_wenshi_ai_key';

function getApiKey(){ try { return localStorage.getItem(LS_KEY) || ''; } catch(e){ return ''; } }

function setApiKey(k){ try { localStorage.setItem(LS_KEY, k); } catch(e){} }



// ===== 初始化 =====

function init() {
  DATA = window.KNOWLEDGE_DATA || [];
  document.getElementById('status').textContent = '正在加载资料库…';

}

var BOOK_ADDED = '2026-09-09'; // 全部书籍收录（上传）日期



function buildDashboard() {

  var el = document.getElementById('dashboard');

  if (!el) return;

  if (!DATA || !DATA.length) return;

  var totalBooks = DATA.length;

  var totalPages = DATA.reduce(function (s, b) { return s + b.pages.length; }, 0);

  // 分类

  var CATS = ['涟源地方文史', '娄底文史', '成书排版稿',  '湘军史料'];

  var catBooks = {};

  CATS.forEach(function (c) { catBooks[c] = []; });

  DATA.forEach(function (b) {

    var cat = BOOK_CAT[b.name] || '其他';

    if (!catBooks[cat]) catBooks[cat] = [];

    catBooks[cat].push(b);

  });

  var catCount = CATS.filter(function (c) { return catBooks[c].length; }).length;

  // 统计卡片

  var html = '<div class="dash">' +

    '<div class="dash-head"><h2>藏书总览</h2>' +

    '<span class="dash-tag">' + CATS.length + ' 个分类 · 收录日期 ' + escapeHtml(BOOK_ADDED) + '</span></div>' +

    '<div class="dash-stats">' +

      '<div class="dash-stat"><div class="num">' + totalBooks + '</div><div class="lbl">藏书（本）</div></div>' +

      '<div class="dash-stat"><div class="num">' + totalPages + '</div><div class="lbl">总页数（页）</div></div>' +

      '<div class="dash-stat"><div class="num">' + catCount + '</div><div class="lbl">藏书分类</div></div>' +

      '<div class="dash-stat"><div class="num">' + DATA.reduce(function (s, b) { return s + (BOOK_META[b.name] && BOOK_META[b.name].src === '排版稿' ? 1 : 0); }, 0) + '</div><div class="lbl">排版稿（本）</div></div>' +

    '</div>';

  // 分类分组

  CATS.forEach(function (cat) {

    var list = catBooks[cat] || [];

    if (!list.length) return;

    var pages = list.reduce(function (s, b) { return s + b.pages.length; }, 0);

    html += '<div class="dash-cat"><div class="dash-cat-head"><h3>' + escapeHtml(cat) + '</h3>' +

      '<span class="dash-cat-tag">' + list.length + ' 本 · ' + pages + ' 页</span></div>';

    html += '<div class="dash-cards">';

    list.forEach(function (b) {

      var m = BOOK_META[b.name] || {};

      var year = m.year || '待考';

      var src = m.src || '';

      var cov = BOOK_COVERS[b.name];

      var coverHtml = cov

        ? '<img class="dash-cover" src="' + cov + '" alt="' + escapeHtml(b.name) + '" loading="lazy">'

        : '<div class="dash-cover dash-cover-fallback">' + escapeHtml((b.name || '书').charAt(0)) + '</div>';

      html += '<div class="dash-card">' +

        '<div class="dash-cover-wrap">' + coverHtml + '</div>' +

        '<div class="dash-card-body">' +

          '<div class="dash-card-name">' + escapeHtml(b.name) + '</div>' +

          '<div class="dash-card-meta">' + b.pages.length + ' 页 · ' + escapeHtml(year) + '年</div>' +

          (src ? '<div class="dash-card-src">' + escapeHtml(src) + '</div>' : '') +

          '<div class="dash-card-added">收录 ' + escapeHtml(BOOK_ADDED) + '</div>' +

        '</div></div>';

    });

    html += '</div></div>';

  });

  html += '<div style="margin-top:14px;font-size:12px;color:#999">出版年份与编者信息来自各书版权页及编者署名；封面为各书原版，排版稿采用专题样式，供研究参考。</div></div>';

  el.innerHTML = html;

}



function escapeHtml(s) {

  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

}



function splitKw(kw) {

  return String(kw || '').split(/[\s，,、;；]+/).map(s => s.trim()).filter(Boolean);

}



function highlight(text, kw) {

  const esc = escapeHtml(text);

  if (!kw) return esc;

  const kws = splitKw(kw);

  let r = esc;

  for (const k of kws) {

    r = r.split(escapeHtml(k)).join('<mark>' + escapeHtml(k) + '</mark>');

  }

  return r;

}

// ===== OCR错字容错检索 + 组合检索 =====
const OCR_MAP = {'涟':['连','链'],'源':['原'],'蓝':['兰'],'燮':['变'],'湘':['相'],'师':['帅'],'杨':['扬'],'县':['具','且'],'龙':['尤'],'志':['忘'],'桥':['侨'],'历':['厉'],'史':['吏'],'城':['诚'],'水':['永'],'滩':['摊']};
function expandVariants(word){
  var res=[String(word)]; var chars=String(word).split('');
  for(var i=0;i<chars.length;i++){
    var alts=OCR_MAP[chars[i]]; if(!alts) continue;
    for(var k=0;k<alts.length;k++){
      var v=chars.slice(); v[i]=alts[k]; res.push(v.join(''));
    }
  }
  return res;
}
function highlightVariants(snippet, kws){
  var esc=escapeHtml(snippet);
  var r=esc;
  for(var i=0;i<kws.length;i++){
    var vs=expandVariants(kws[i]);
    for(var j=0;j<vs.length;j++){
      var e=escapeHtml(vs[j]);
      r=r.split(e).join('<mark>'+e+'</mark>');
    }
  }
  return r;
}

var lastSearchHits=[];
var lastCitation='';
function exportCitation(){
  if(!lastSearchHits || !lastSearchHits.length){ alert('暂无可整理的引文，请先检索'); return; }
  var seen={}, list=[], n=1;
  for(var i=0;i<lastSearchHits.length;i++){
    var h=lastSearchHits[i];
    var key=h.book+'|'+h.page;
    if(seen[key]) continue;
    seen[key]=true;
    var t=String(h.text||'').replace(/\s+/g,' ').trim();
    if(t.length>200) t=t.substring(0,200)+'…';
    list.push('- 〔'+n+'〕《'+h.book+'》第'+h.page+'页：'+t);
    n++;
  }
  lastCitation=list.join('\n');
  document.getElementById('result').innerHTML='<div class="empty" style="text-align:left;white-space:pre-wrap;">'+escapeHtml(lastCitation)+'</div>'
    +'<div class="cite-bar"><button onclick="copyCitation()">复制引文</button> <button onclick="exportCitationWord()">导出Word</button></div>';
  document.getElementById('status').textContent='已整理为 '+(n-1)+' 条规范引文，可直接用于编书注释。';
}

async function search() { await ensureData();

  const kw = document.getElementById('kw').value.trim();

  if (!kw) { alert('请输入地名或人名'); return; }

  lastKw = kw;

  const kws = splitKw(kw);

  const total = { count: 0, books: 0 };

  let html = '';

  let foundAny = false;

  lastSearchHits = [];

  for (const book of DATA) {

    const hits = [];

    let cnt = 0;

    for (const pg of book.pages) {

      let ok = true, hitVar = null;

      for (let i = 0; i < kws.length; i++) {

        const vs = expandVariants(kws[i]);

        let hit = false;

        for (let j = 0; j < vs.length; j++) { if (pg.t.includes(vs[j])) { hit = true; hitVar = vs[j]; break; } }

        if (!hit) { ok = false; break; }

      }

      if (!ok) continue;

      const idx = pg.t.indexOf(hitVar || kws[0]);

      const s = Math.max(0, idx - 60), e = Math.min(pg.t.length, idx + kw.length + 60);

      let snippet = pg.t.substring(s, e);

      if (s > 0) snippet = '…' + snippet;

      if (e < pg.t.length) snippet = snippet + '…';

      hits.push({ p: pg.p, snippet: snippet, book: book.name, page: pg.p, text: snippet });

      cnt++;

    }

    if (cnt > 0) {

      foundAny = true;

      total.count += cnt;

      total.books++;

      html += '<div class="book-block"><div class="book-head"><span>' + escapeHtml(book.name) +

              '</span><span class="cnt">' + cnt + ' 处</span></div>';

      hits.slice(0, 40).forEach(h => {

        html += '<div class="page-item"><span class="pg">第' + h.p + '页</span><div class="txt">' +

                highlightVariants(h.snippet, kws) + '</div></div>';

      });

      if (hits.length > 40) html += '<div class="page-item">… 共' + hits.length + '处，其余请查看索引表</div>';

      html += '</div>';

      lastSearchHits = lastSearchHits.concat(hits);

    }

  }

  if (!foundAny) {

    html = '<div class="empty">未在已收录书籍中找到「' + escapeHtml(kw) + '」<br>可尝试更短的关键词；用空格或逗号隔开多词可交叉检索（如「钱钟书 蓝田」）；系统已自动识别常见OCR形近错字（如「涟源」亦可搜到「连源」）</div>';

  } else {

    html += '<div class="cite-bar"><button onclick="exportCitation()">整理为规范引文</button></div>';

  }

  document.getElementById('result').innerHTML = html;

  document.getElementById('status').textContent = '「' + kw + '」共检索到 ' + total.count + ' 处，分布于 ' + total.books + ' 本书。';

  showTab('book');

}

async function combine() { await ensureData();

  let html = '<div class="combine-view"><h2 style="color:#1F4E78">关于「' + escapeHtml(kw) + '」的整合材料</h2>';

  for (const book of DATA) {

    const kws = splitKw(kw);

    for (const pg of book.pages) {

      if (!kws.every(k => pg.t.includes(k))) continue;

      const idx = pg.t.indexOf(kws[0]);

      const s = Math.max(0, idx - 80), e = Math.min(pg.t.length, idx + kw.length + 80);

      snippets.push({ p: pg.p, t: pg.t.substring(s, e) });

    }

    if (snippets.length) {

      foundAny = true;

      html += '<h3>' + escapeHtml(book.name) + '</h3>';

        '<div style="margin:6px 0">…' + highlight(sn.t, kw) +

  document.getElementById('status').textContent = '「' + kw + '」整合材料已生成。';

  showTab('combine');

// ===== markdown 渲染 =====

function mdToHtml(md) {

  if (!md) return '';

  let lines = md.split(/\n/);

  let html = '';

  let inList = false;

  for (let line of lines) {

    line = line.trim();

    if (!line) { if (inList) { html += '</ul>'; inList = false; } continue; }

    let m1 = line.match(/^#{1,3}\s+(.*)$/);

    if (m1) {

      if (inList) { html += '</ul>'; inList = false; }

      const level = (line.match(/^#+/) || [''])[0].length;

      const tag = level <= 1 ? 'h1' : (level === 2 ? 'h2' : 'h3');

      html += '<' + tag + '>' + escapeHtml(m1[1]) + '</' + tag + '>';

      continue;

    }

    let m2 = line.match(/^[-*]\s+(.*)$/);

    if (m2) {

      if (!inList) { html += '<ul>'; inList = true; }

      html += '<li>' + escapeHtml(m2[1]) + '</li>';

      continue;

    }

    if (inList) { html += '</ul>'; inList = false; }

    let t = escapeHtml(line);

    t = t.replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>');

    html += '<p>' + t + '</p>';

  }

  if (inList) html += '</ul>';

  return html;

}



// ===== 前端抓取相关原文（对应后端 collect_sentences）=====

function splitSentences(text) {

  return text.split(/(?<=[。！？；!?;])/).map(s => s.trim()).filter(s => s.length > 0);

}



function collectSentencesFront(kw) {

  const results = [];

  for (const book of DATA) {

    const bname = book.name || '';

    const pagesMap = {};

    for (const pg of book.pages) {

      const text = pg.t || '';

      if (text.indexOf(kw) === -1) continue;

      const sents = splitSentences(text);

      const matched = [];

      for (let i = 0; i < sents.length; i++) {

        if (sents[i].indexOf(kw) !== -1) {

          let merged = sents[i];

          if (merged.length < 15 && i + 1 < sents.length) merged += sents[i + 1];

          matched.push(merged);

        }

      }

      if (matched.length) pagesMap[pg.p] = matched;

    }

    const pkeys = Object.keys(pagesMap);

    if (pkeys.length) {

      const items = [];

      let count = 0, chars = 0;

      const sortedPages = pkeys.map(Number).sort(function(a, b){ return a - b; });

      for (let pi = 0; pi < sortedPages.length; pi++) {

        const page = String(sortedPages[pi]);

        const pageText = pagesMap[page].join(' ');

        count += pagesMap[page].length;

        chars += pageText.length;

        items.push({ page: page, text: pageText });

      }

      results.push({

        book: bname,

        count: count,

        chars: chars,

        pages: sortedPages,

        items: items

      });

    }

  }

  return results;

}

// ===== 前端调 DeepSeek（支持断点续写）=====

function callDeepSeekFront(apiKey, system, user) {

  const url = 'https://api.deepseek.com/chat/completions';

  const messages = [

    { role: 'system', content: system },

    { role: 'user', content: user }

  ];

  let full = '';

  const maxRounds = 8;

  function oneRound() {

    return fetch(url, {

      method: 'POST',

      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + apiKey },

      body: JSON.stringify({

        model: 'deepseek-v4-pro',

        messages: messages,

        temperature: 0.7,

        max_tokens: 8192,

        stream: false

      })

    }).then(function(resp){

      if (!resp.ok) {

        return resp.text().then(function(txt){

          let msg = '请求失败：' + resp.status;

          try { const e = JSON.parse(txt); if (e.error && e.error.message) msg = e.error.message; } catch(e2){}

          throw new Error(msg);

        });

      }

      return resp.json();

    }).then(function(d){

      const content = d.choices[0].message.content;

      const finish = d.choices[0].finish_reason;

      full += content;

      if (finish !== 'length') return full;

      messages.push({ role: 'assistant', content: content });

      messages.push({ role: 'user', content: '【继续】请紧接上文最后一句，继续往下写完整，不要重复已写内容，直到写完为止。' });

      if (messages.length / 2 - 1 >= maxRounds) return full;

      return oneRound();

    });

  }

  return oneRound();

}

function buildBatches(results, cap) {

  // 第一步：把每本书的摘录按页切分为若干段，每段累计有效字符不超过 cap（单本超界则切成多段）

  const segs = [];

  for (const r of results) {

    let cur = { book: r.book, count: 0, chars: 0, pages: [], items: [] };

    for (const it of r.items) {

      const eff = Math.min((it.text || '').length, 300);

      if (cur.items.length && cur.chars + eff > cap) {

        segs.push(cur); cur = { book: r.book, count: 0, chars: 0, pages: [], items: [] };

      }

      cur.items.push(it); cur.chars += eff; cur.count += 1; cur.pages.push(Number(it.page));

    }

    if (cur.items.length) segs.push(cur);

  }

  // 第二步：把段贪心装入批次，保证每批累计有效字符不超过 cap

  const batches = [];

  let curB = [], curChars = 0;

  for (const s of segs) {

    if (curB.length && curChars + s.chars > cap) { batches.push(curB); curB = []; curChars = 0; }

    curB.push(s); curChars += s.chars;

  }

  if (curB.length) batches.push(curB);

  return batches;

}

async function aiWriteBatch(kw, apiKey, results) {

  const cap = 38000;

  const batches = buildBatches(results, cap);

  const summaries = [];

  const status = document.getElementById('status');

  for (let i = 0; i < batches.length; i++) {

    if (status) status.textContent = '正在综述第 ' + (i + 1) + '/' + batches.length + ' 批史料…';

    const bprompt = buildBatchPrompt(kw, batches[i]);

    const s = await callDeepSeekFront(apiKey, bprompt.system, bprompt.user);

    summaries.push(s);

  }

  if (status) status.textContent = '正在整合各批综述成文…';

  const mprompt = buildMergePrompt(kw, summaries);

  return await callDeepSeekFront(apiKey, mprompt.system, mprompt.user);

}



async function doAiWrite(kw, apiKey) { await ensureData();

  let results;

  try {

    results = collectSentencesFront(kw);

  } catch (err) {

    document.getElementById('result').innerHTML = '<div class="ai-err">数据处理失败：' + escapeHtml(String(err && err.message ? err.message : err)) + '</div>';

    document.getElementById('status').textContent = '生成失败。';

    return;

  }

  if (!results.length) {

    document.getElementById('result').innerHTML =

      '<div class="empty">未在已收录书籍中找到「' + escapeHtml(kw) + '」的相关记载<br>可尝试更短的关键词或变体，如「涟源」亦可搜「链源」</div>';

    document.getElementById('status').textContent = '未检索到记载。';

    return;

  }

  const totalCharsAll = results.reduce(function(s, r){ return s + (r.chars || 0); }, 0);

  const SINGLE_CAP = 40000;

  const articlePromise = (totalCharsAll <= SINGLE_CAP)

    ? (function(){ const prompt = buildPromptFront(kw, results); return callDeepSeekFront(apiKey, prompt.system, prompt.user); })()

    : aiWriteBatch(kw, apiKey, results);

  articlePromise.then(function(article){

    const total = results.reduce(function(s, r){ return s + r.count; }, 0);

    const books = results.map(function(r){

      return { book: r.book, count: r.count, pages: r.pages.slice(0, 60) };

    });

    addHistoryFront({ kw: kw, total: total, book_count: results.length, books: books, article: article });

    lastSummaryPlain = '【' + kw + '】AI综述文章\n\n' + article;

    const meta = '基于 ' + results.length + ' 本书、' + total + ' 处记载生成：' +

                 results.map(function(r){ return '《' + r.book + '》'; }).join('、');

    document.getElementById('result').innerHTML =

      '<div class="copybar">' +

      '<button onclick="copySummary()">复制全文</button> ' +

      '<button onclick="exportLastArticle()">导出Word</button></div>' +

      '<div class="ai-view"><div class="ai-meta">' + escapeHtml(meta) +

      '</div>' + mdToHtml(article) + '</div>';

    document.getElementById('status').textContent =

      '「' + kw + '」AI综述文章已生成（' + results.length + '本书、' + total + '处记载）。';

    showTab('ai');

  }).catch(function(err){

    document.getElementById('result').innerHTML =

      '<div class="ai-err">生成失败：' + escapeHtml(String(err && err.message ? err.message : err)) + '</div>';

    document.getElementById('status').textContent = '生成失败。';

  });

}

// ===== 导出 Word（前端 docx，公文排版）=====

function ensureDocxLib(cb) {

  if (typeof docx !== 'undefined') { cb(); return; }

  const s = document.createElement('script');

  s.src = 'https://cdn.jsdelivr.net/npm/docx@7.8.2/build/index.js';

  s.onload = function(){ cb(); };

  s.onerror = function(){ alert('Word导出库加载失败，请检查网络连接'); };

  document.head.appendChild(s);

}



function buildDocxAndDownload(rec) {

  try {

    const lines = (rec.article || '').trim().split('\n');

    const title = (rec.kw || '') + '史料综述';

    const children = [];

    children.push(new docx.Paragraph({

      alignment: docx.AlignmentType.CENTER,

      spacing: { line: 600 },

      children: [new docx.TextRun({ text: title, font: '方正小标宋简体', size: 44 })]

    }));

    children.push(new docx.Paragraph({ spacing: { line: 600 }, children: [new docx.TextRun({ text: '' })] }));

    for (let i = 0; i < lines.length; i++) {

      const l = lines[i].trim();

      if (!l) {

        children.push(new docx.Paragraph({ spacing: { line: 600 }, children: [new docx.TextRun({ text: '' })] }));

        continue;

      }

      let text = l.replace(/\*\*([^*]+)\*\*/g, '$1');

      let fname = '仿宋_GB2312';

      let size = 32;

      let bold = false;

      let align = null;

      const m = l.match(/^(#{1,3})\s+(.*)$/);

      if (m) {

        const lvl = m[1].length;

        text = m[2].trim();

        if (lvl === 1) { fname = '黑体'; size = 32; align = docx.AlignmentType.CENTER; }

        else if (lvl === 2) { fname = '楷体_GB2312'; size = 32; bold = true; }

        else { fname = '仿宋_GB2312'; size = 32; bold = true; }

      } else if (/^[-*]\s+/.test(l)) {

        text = l.replace(/^[-*]\s+/, '');

        fname = '仿宋_GB2312';

        size = 28;

      }

      const pOpts = {

        indent: { firstLine: 640 },

        spacing: { line: 600 },

        children: [new docx.TextRun({ text: text, font: fname, size: size, bold: bold })]

      };

      if (align) pOpts.alignment = align;

      children.push(new docx.Paragraph(pOpts));

    }

    const docobj = new docx.Document({

      sections: [{

        properties: { page: { margin: { top: 1440, bottom: 1440, left: 1440, right: 1440 } } },

        children: children

      }]

    });

    docx.Packer.toBlob(docobj).then(function(blob){

      const a = document.createElement('a');

      a.href = URL.createObjectURL(blob);

      a.download = title + '.docx';

      document.body.appendChild(a);

      a.click();

      document.body.removeChild(a);

      URL.revokeObjectURL(a.href);

      alert('已导出Word文档');

    }).catch(function(){ alert('导出失败，请重试'); });

  } catch (err) {

    alert('导出失败：' + String(err && err.message ? err.message : err));

  }

}

function showPageDetail(bookName, pageNo) {

  var book = null;

  for (var i = 0; i < DATA.length; i++) {

    if (DATA[i].name === bookName) { book = DATA[i]; break; }

  }

  var text = '';

  if (book) {

    for (var j = 0; j < book.pages.length; j++) {

      if (String(book.pages[j].p) === String(pageNo)) { text = book.pages[j].t; break; }

    }

  }

  if (!book || !text) {

    alert('未找到《' + bookName + '》第' + pageNo + '页的原文。');

    return;

  }

  var mask = document.getElementById('lwModal');

  if (!mask) {

    mask = document.createElement('div');

    mask.className = 'modal-mask';

    mask.onclick = function (e) { if (e.target === mask) closePageDetail(); };

    '<button class="modal-close" onclick="closePageDetail()">关闭</button></div>' +

    '<div class="modal-body">' + escapeHtml(text) + '</div></div>';

async function search() { await ensureData();

  var kw = document.getElementById('kw').value.trim();

  if (!kw) { alert('请输入地名或人名'); return; }

  lastKw = kw;

  var kws = splitKw(kw);

  var total = { count: 0, books: 0 };

  var html = '';

  var foundAny = false;

  for (var i = 0; i < DATA.length; i++) {

    var book = DATA[i];

    var hits = [];

    var cnt = 0;

    for (var k = 0; k < book.pages.length; k++) {

      var pg = book.pages[k];

      if (!kws.every(function (q) { return pg.t.indexOf(q) !== -1; })) continue;

      var idx = pg.t.indexOf(kws[0]);

      var s = Math.max(0, idx - 60), e = Math.min(pg.t.length, idx + kw.length + 60);

      var snippet = pg.t.substring(s, e);

      if (s > 0) snippet = '…' + snippet;

      if (e < pg.t.length) snippet = snippet + '…';

      hits.push({ p: pg.p, snippet: snippet });

      cnt++;

    }

    if (cnt > 0) {

      foundAny = true;

      total.count += cnt;

      total.books++;

      html += '<div class="book-block"><div class="book-head"><span>' + escapeHtml(book.name) +

              '</span><span class="cnt">' + cnt + ' 处</span></div>';

      hits.slice(0, 40).forEach(function (h) {

        html += '<div class="page-item"><span class="pg pgclick" onclick="showPageDetail(\'' +

                escApos(book.name) + '\',' + h.p + ')">第' + h.p + '页</span>' +

                '<div class="txt">' + highlight(h.snippet, kw) + '</div></div>';

      });

      if (hits.length > 40) html += '<div class="page-item">… 共' + hits.length + '处，其余请查看索引表</div>';

      html += '</div>';

    }

  }

  if (!foundAny) {

    html = '<div class="empty">未在已收录书籍中找到「' + escapeHtml(kw) + '」<br>可尝试更短的关键词、用空格隔开多词（如「钱钟书 萝卜」），或变体如「涟源」亦可搜「链源」</div>';

  }

  document.getElementById('result').innerHTML = html;

  document.getElementById('status').textContent = '「' + kw + '」共检索到 ' + total.count + ' 处，分布于 ' + total.books + ' 本书。';

  setTabActive('book');

}

// ===== 专题聚合：收集某专题下所有原文 =====

function collectTopic(topic) {

  var results = [];

  for (var i = 0; i < DATA.length; i++) {

    var book = DATA[i];

    var pagesMap = {};

    var kwHit = {};

    for (var k = 0; k < book.pages.length; k++) {

      var pg = book.pages[k];

      var hit = null;

      for (var q = 0; q < topic.keywords.length; q++) {

        if (pg.t.indexOf(topic.keywords[q]) !== -1) { hit = topic.keywords[q]; break; }

      }

      if (!hit) continue;

      if (!kwHit[hit]) kwHit[hit] = 0;

      kwHit[hit]++;

      var sents = splitSentences(pg.t);

      for (var si = 0; si < sents.length; si++) {

        if (sents[si].indexOf(hit) !== -1) {

          var m = sents[si];

          if (m.length < 20 && si + 1 < sents.length) m += sents[si + 1];

          if (!pagesMap[pg.p]) pagesMap[pg.p] = [];

          pagesMap[pg.p].push(m);

        }

      }

    }

    var pkeys = Object.keys(pagesMap);

    if (pkeys.length) {

      var items = [], count = 0, chars = 0;

      var sortedPages = pkeys.map(Number).sort(function (a, b) { return a - b; });

      for (var pi = 0; pi < sortedPages.length; pi++) {

        var page = String(sortedPages[pi]);

        var pageText = pagesMap[page].join(' ');

        var eff = Math.min(pageText.length, 300);

        count += pagesMap[page].length;

        chars += eff;

        items.push({ page: page, text: pageText });

      }

      results.push({ book: book.name, count: count, chars: chars, pages: sortedPages, items: items, kwHit: kwHit });

    }

  }

  return results;

}

// ===== 纪年解析：把汉字数字纪年转公元年 =====

function cnNum(s) {

  var map = {零:0,一:1,二:2,三:3,四:4,五:5,六:6,七:7,八:8,九:9,十:10,百:100,千:1000,廿:20,卅:30};

  var chars = String(s || '').split('');

  var total = 0, sec = 0;

  for (var i = 0; i < chars.length; i++) {

    var v = map[chars[i]];

    if (v === undefined) return 0;

    if (v === 10 || v === 100 || v === 1000) {

      if (sec === 0 && v === 10) total += 10; else total += (sec || 1) * v;

      sec = 0;

    } else { sec += v; }

  }

  return total + sec;

}

var JIANG_ERA = {宣统:1909,光绪:1875,同治:1862,咸丰:1851,道光:1821,嘉庆:1796,乾隆:1736};

function parseYearFromSentence(s) {

  var m;

  if (/民国元年/.test(s)) return 1912;

  m = s.match(/(宣统|光绪|同治|咸丰|道光|嘉庆|乾隆)元年/);

  if (m && JIANG_ERA[m[1]]) return JIANG_ERA[m[1]];

  m = s.match(/(?:18|19|20)\d{2}年/);

  if (m) return parseInt(m[0].replace('年',''), 10);

  m = s.match(/民国([一二三四五六七八九十廿卅百]+)年/);

  if (m) return 1911 + cnNum(m[1]);

  m = s.match(/(宣统|光绪|同治|咸丰|道光|嘉庆|乾隆)([一二三四五六七八九十廿卅百]+)年/);

  if (m && JIANG_ERA[m[1]]) return JIANG_ERA[m[1]] + cnNum(m[2]) - 1;

  return null;

}

<script>

/* ==================== AI 研究（AI Research）功能 ====================

   定位：从"关键词综述"升级为"自然语言提问研究"。

   核心：全库检索证据 → 交给 AI 做证据链分析 → 带出处回答；无证据必须如实回绝。

   ================================================================ */



// ===== AI研究关键词提取：全文子串匹配（摆脱固定词表） =====

// 原理：把问题中能在全库命中的连续子串提取出来作为关键词，

// 任何出现在书里的词（人名/地名/机构等）都能被识别，不再依赖手工词表。

// 命中后对子串做"去虚词收缩"，保留干净的核心专名。

var _FULLTEXT = null;              // 全库文本全集（懒构建）

var _FULLTEXT_BUILT = false;

function ensureFulltext() {

  if (_FULLTEXT_BUILT) return;

  var parts = [];

  var bi, pi;

  for (bi = 0; bi < DATA.length; bi++) {

    var pages = DATA[bi].pages || [];

    for (pi = 0; pi < pages.length; pi++) {

      parts.push(pages[pi].t || '');

    }

  }

  // 用不可见分隔符连接，避免跨页误匹配

  _FULLTEXT = parts.join('\u0001');

  _FULLTEXT_BUILT = true;

}

// 判断某子串是否在全库任何一页原文中出现过

function existsInLibrary(sub) {

  if (sub.length < 2) return false;

  ensureFulltext();

  return _FULLTEXT.indexOf(sub) !== -1;

}

// 常见虚词/功能字（用于收缩关键词边界）

var FUNC_WORDS = '的在了与于中时上地下里后前而所和及其或之是作为对从到被把由向着者这那该用看们子儿头家';

function isFuncChar(ch) {

  return FUNC_WORDS.indexOf(ch) !== -1;

}

// 从自然语言问题中提取检索关键词（全文子串匹配 + 去虚词收缩）

function extractResearchKeywords(question) {

  // 去掉标点、空白、数字符号，只留中文与字母

  var clean = String(question || '').replace(/[^\u4e00-\u9fa5A-Za-z]/g, '');

  if (clean.length < 2) return [];

  var found = [];

  var i = 0;

  var MAXLEN = 8;             // 单个关键词最长取 8 字

  var MINLEN = 2;

  while (i < clean.length) {

    var matched = false;

    // 从当前起点，尝试从长到短取子串，命中即跳过（贪心最长匹配）

    for (var len = Math.min(MAXLEN, clean.length - i); len >= MINLEN; len--) {

      var sub = clean.substring(i, i + len);

      if (existsInLibrary(sub)) {

        // 收缩：从尾部剥掉虚词字

        var core = sub;

        while (core.length > 2 && isFuncChar(core.charAt(core.length - 1))) {

          core = core.substring(0, core.length - 1);

        }

        // 从头部剥掉虚词字

        while (core.length > 2 && isFuncChar(core.charAt(0))) {

          core = core.substring(1);

        }

        if (core.length >= 2 && existsInLibrary(core)) {

          found.push(core);

          i += core.length;

        } else {

          found.push(sub);

          i += sub.length;

        }

        matched = true;

        break;

      }

    }

    if (!matched) i++;        // 当前位置无有效子串，前进一格

  }

  // 去重并剔除被更长词包含的冗余词

  found.sort(function (a, b) { return b.length - a.length; });

  var result = [];

  for (var j = 0; j < found.length; j++) {

    var w = found[j];

    var dup = false;

    for (var s = 0; s < result.length; s++) {

      if (result[s].indexOf(w) !== -1) { dup = true; break; }

    }

    if (!dup) result.push(w);

  }

  return result;

}





// 收集证据：对每个关键词在全库检索，返回带书名页码的原文片段

// 每个关键词最多取若干页，控制总量

function collectResearchEvidence(keywords) {

  var evidence = [];

  var perKw = 6;          // 每个关键词最多取6页

  var maxTotal = 60;      // 总证据块上限

  for (var k = 0; k < keywords.length; k++) {

    var kw = keywords[k];

    var count = 0;

    for (var bi = 0; bi < DATA.length && count < perKw; bi++) {

      var book = DATA[bi];

      var bname = book.name || '';

      var hitPages = [];

      for (var pi = 0; pi < book.pages.length; pi++) {

        var pg = book.pages[pi];

        var text = pg.t || '';

        if (text.indexOf(kw) === -1) continue;

        hitPages.push(pg);

        if (hitPages.length >= 3) break; // 每本书最多取3页

      }

      for (var hi = 0; hi < hitPages.length; hi++) {

        var hp = hitPages[hi];

        var idx = hp.t.indexOf(kw);

        var s = Math.max(0, idx - 100), e = Math.min(hp.t.length, idx + kw.length + 150);

        var snippet = (s > 0 ? '…' : '') + hp.t.substring(s, e) + (e < hp.t.length ? '…' : '');

        snippet = snippet.replace(/\s+/g, ' ').trim();

        evidence.push({

          kw: kw,

          book: bname,

          page: hp.p,

          text: snippet

        });

        count++;

      }

    }

    if (evidence.length >= maxTotal) break;

  }

  return evidence;

}

    '5. 【找不到必须明说】如果摘录中没有任何一条材料能支撑回答这个问题，你必须明确回答：',

  var user = '研究问题：' + question + '\n\n';

  user += '已尝试检索的关键词：' + (keywords.join('、') || '（未能从问题中识别出具体关键词）') + '\n\n';

  if (noEvidence) {

    user += '【检索结果】在全部已收录书籍中，上述关键词均未检索到相关记载。请据此如实回答。';

  } else {

    user += '【史料原文摘录】以下是从各书中检索到的相关原文（每条含书名、页码）：\n';

    var body = [];

    for (var i = 0; i < evidence.length; i++) {

      var ev = evidence[i];

    }

    user += body.join('\n');

    user += '\n\n请严格依据以上摘录回答，言必有据，每条结论注明出处，找不到的如实说没有。';

  }

  return { system: sys, user: user };

}

// ===== AI研究多轮追问（追加覆盖） =====

var researchThread = null;



function callDeepSeekThread(apiKey, messages) {

  const url = 'https://api.deepseek.com/chat/completions';

  const msgs = messages.map(function(m){ return { role: m.role, content: m.content }; });

  let full = '';

  const initLen = msgs.length;

  const maxRounds = 8;

  function oneRound() {

    return fetch(url, {

      method: 'POST',

      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + apiKey },

      body: JSON.stringify({ model: 'deepseek-v4-pro', messages: msgs, temperature: 0.7, max_tokens: 8192, stream: false })

    }).then(function(resp){

      if (!resp.ok) {

        return resp.text().then(function(txt){

          let msg = '请求失败：' + resp.status;

          try { const e = JSON.parse(txt); if (e.error && e.error.message) msg = e.error.message; } catch(e2){}

          throw new Error(msg);

        });

      }

      return resp.json();

    }).then(function(d){

      const content = d.choices[0].message.content;

      const finish = d.choices[0].finish_reason;

      full += content;

      if (finish !== 'length') return full;

      msgs.push({ role: 'assistant', content: content });

      msgs.push({ role: 'user', content: '【继续】请紧接上文最后一句，继续往下写完整，不要重复已写内容，直到写完为止。' });

      if (Math.floor((msgs.length - initLen) / 2) >= maxRounds) return full;

      return oneRound();

    });

  }

  return oneRound();

}

// ===== AI研究全覆盖多轮追问（追加覆盖） =====

var researchThread = null;



function callDeepSeekThread(apiKey, messages) {

  const url = 'https://api.deepseek.com/chat/completions';

  const msgs = messages.map(function(m){ return { role: m.role, content: m.content }; });

  let full = '';

  const initLen = msgs.length;

  const maxRounds = 8;

  function oneRound() {

    return fetch(url, {

      method: 'POST',

      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + apiKey },

      body: JSON.stringify({ model: 'deepseek-v4-pro', messages: msgs, temperature: 0.7, max_tokens: 8192, stream: false })

    }).then(function(resp){

      if (!resp.ok) {

        return resp.text().then(function(txt){

          let msg = '请求失败：' + resp.status;

          try { const e = JSON.parse(txt); if (e.error && e.error.message) msg = e.error.message; } catch(e2){}

          throw new Error(msg);

        });

      }

      return resp.json();

    }).then(function(d){

      const content = d.choices[0].message.content;

      const finish = d.choices[0].finish_reason;

      full += content;

      if (finish !== 'length') return full;

      msgs.push({ role: 'assistant', content: content });

      msgs.push({ role: 'user', content: '【继续】请紧接上文最后一句，继续往下写完整，不要重复已写内容，直到写完为止。' });

      if (Math.floor((msgs.length - initLen) / 2) >= maxRounds) return full;

      return oneRound();

    });

  }

  return oneRound();

}

function buildResearchUserContent(question, keywords, evidence, noEvidence) {

  if (noEvidence) {

    user += '【检索结果】在全部已收录书籍中，上述关键词均未检索到相关记载。请据此如实回答。';

  } else {

    user += '【史料原文摘录】以下是从各书中检索到的相关原文（每条含书名、页码）：\n';

    var body = [];

    for (var i = 0; i < evidence.length; i++) {

      var ev = evidence[i];

      body.push('《' + ev.book + '》第' + ev.page + '页（命中词：' + ev.kw + '）：' + ev.text);

    }

    user += body.join('\n');

// ===== 全覆盖证据采集（不受条数/页数/本数限制）=====

function collectAllEvidenceFull(keywords) {

  var results = [];

  for (var bi = 0; bi < DATA.length; bi++) {

    var book = DATA[bi];

    var pagesMap = {};

    for (var pi = 0; pi < book.pages.length; pi++) {

      var pg = book.pages[pi];

      var text = pg.t || '';

      var hit = false;

      for (var q = 0; q < keywords.length; q++) { if (text.indexOf(keywords[q]) !== -1) { hit = true; break; } }

      if (!hit) continue;

      var sents = splitSentences(text);

      var matched = [];

      for (var si = 0; si < sents.length; si++) {

        var ss = sents[si];

        var h2 = false;

        for (var q2 = 0; q2 < keywords.length; q2++) { if (ss.indexOf(keywords[q2]) !== -1) { h2 = true; break; } }

        if (h2) {

          if (ss.length < 15 && si + 1 < sents.length) ss += sents[si + 1];

          matched.push(ss);

        }

      }

      if (matched.length) pagesMap[pg.p] = matched;

    }

    var pkeys = Object.keys(pagesMap);

    if (pkeys.length) {

      var items = [], count = 0, chars = 0;

      var sorted = pkeys.map(Number).sort(function (a, b) { return a - b; });

      for (var k = 0; k < sorted.length; k++) {

        var page = String(sorted[k]);

        var pageText = pagesMap[page].join(' ');

        count += pagesMap[page].length;

        chars += Math.min(pageText.length, 300);

        items.push({ page: page, text: pageText });

      }

      results.push({ book: book.name, count: count, chars: chars, pages: sorted, items: items });

    }

  }

  return results;

}

  ].join('\n');

  var user = '研究问题：' + question + '\n\n【本批史料摘录】\n' + body.join('\n') + '\n\n请按上述要求提炼本批与问题相关的关键事实并逐一注明出处。';

// 统一全流程：全覆盖采集 → 单批或分批 → 回答

async function collectAndAnswer(question, apiKey) { await ensureData();

  var keywords = extractResearchKeywords(question);

  var fullRes = keywords.length ? collectAllEvidenceFull(keywords) : [];

  var totalChars = fullRes.reduce(function (s, r) { return s + r.chars; }, 0);

  var hasEvidence = fullRes.length > 0;

  var sys = buildResearchSystem();

  var overview = fullRes.map(function (r) { return { book: r.book, count: r.count, pages: r.pages.length }; });

  researchThread.evidences.push({ keywords: keywords, overview: overview, noEvidence: !hasEvidence });

  var SINGLE_CAP = 40000;

  if (!hasEvidence) {

    var u = buildResearchUserContent(question, keywords, [], true);

    return callThreadWithHistory(apiKey, sys, u, question);

  }

  if (totalChars <= SINGLE_CAP) {

    var body = [];

    for (var i = 0; i < fullRes.length; i++) {

      var r = fullRes[i];

      for (var j = 0; j < r.items.length; j++) {

        var it = r.items[j]; var t = it.text;

        if (t.length > 300) t = t.substring(0, 300) + '…';

        body.push('【《' + r.book + '》第' + it.page + '页】' + t);

      }

    }

    var u2 = '研究问题：' + question + '\n\n已尝试检索的关键词：' + keywords.join('、') + '\n\n【史料原文摘录】\n' + body.join('\n') + '\n\n请严格依据以上摘录回答，言必有据，每条结论注明出处，找不到的如实说没有。';

    return callThreadWithHistory(apiKey, sys, u2, question);

  }

  var batches = buildBatches(fullRes, 38000);

  var chain = Promise.resolve();

  var summaries = [];

  for (var bi = 0; bi < batches.length; bi++) {

    (function (batch) {

      chain = chain.then(function () {

        var bp = buildBatchResearchPrompt(question, batch);

        return callDeepSeekThread(apiKey, [{ role: 'system', content: bp.system }, { role: 'user', content: bp.user }]).then(function (s) { summaries.push(s); });

      });

    })(batches[bi]);

  }

  return chain.then(function () {

    var sp = buildSynthesizePrompt(question, summaries, keywords, true);

    return callThreadWithHistory(apiKey, sys, sp, question);

  });

}

async function researchFollowUp() { await ensureData();

  var inp = document.getElementById('researchAsk');

  var q = (inp ? inp.value : '').trim();

  if (!q) { alert('请输入要继续追问的问题'); return; }

  var apiKey = window._rApiKey || getApiKey();

  if (!apiKey) { openSettings(); document.getElementById('status').textContent = '请先设置 API Key。'; return; }

  var cm = /^【([^】]+)】/.exec(q);

  var isCmd = cm !== null;

  document.getElementById('result').innerHTML +=

    '<div class="ai-loading"><div class="spin"></div><br>' + (isCmd ? '正在基于已有研究执行「' + escapeHtml(q) + '」…' : '正在继续研究「' + escapeHtml(q) + '」，请稍候…') + '</div>';

  document.getElementById('status').textContent = isCmd ? '正在执行指令…' : '正在继续研究…';

  if (isCmd) {

    var cmd = cm[1];

    var cmdSys = buildResearchSystem() + '\n\n' + (cmd === '提炼成文' ? STYLE_REQ_FULL : STYLE_REQ_LIGHT) + '\n\n【重要】用户上一条消息是一个操作指令（' + cmd + '），并非需要重新检索史料的新研究问题。请直接基于本次对话中此前已生成的全部研究结论与已列出的史料出处来完成此操作，不要把它当作新主题去检索，不得新造或臆测，每条结论延续已有出处标注。';

    var cmdUser = '请针对本次对话此前已经形成的研究内容，执行如下操作：' + cmd + '。\n\n要求：严格基于前面已给出的研究与史料出处，内容直接可用，结论逐条注明出处。';

    collectAndAnswer(q, apiKey, cmdSys, cmdUser).then(function (answer) {

      researchThread.messages.push({ role: 'assistant', content: answer });

      renderResearchChat(apiKey);

    }).catch(function (err) {

      document.getElementById('result').innerHTML =

        document.getElementById('result').innerHTML + '<div class="ai-err">追问出错：' + escapeHtml(String(err && err.message ? err.message : err)) + '</div>';

      document.getElementById('status').textContent = '追问失败。';

    });

    return;

  }

  collectAndAnswer(q, apiKey).then(function (answer) {

    researchThread.messages.push({ role: 'assistant', content: answer });

    renderResearchChat(apiKey);

  }).catch(function (err) {

    document.getElementById('result').innerHTML =

      document.getElementById('result').innerHTML + '<div class="ai-err">追问出错：' + escapeHtml(String(err && err.message ? err.message : err)) + '</div>';

    document.getElementById('status').textContent = '追问失败。';

  });

}



function saveResearchToHistory() {

  if (!researchThread || !researchThread.messages.length) { alert('暂无可保存的研究'); return; }

  var article = buildResearchArticle();

  var total = 0;

  for (var i = 0; i < researchThread.evidences.length; i++) {

    var ov = researchThread.evidences[i].overview;

    for (var j = 0; j < ov.length; j++) total += ov[j].count;

  var rounds = researchThread.messages.filter(function(m){ return m.role === 'user' && m.question; }).length;

  addHistoryFront({ kw: researchThread.firstQuestion + '（AI研究）', total: total, book_count: rounds, books: [], article: article });

  lastSummaryPlain = '【' + researchThread.firstQuestion + '】AI研究对话\n\n' + article;

// ===== 全覆盖采集性能修复（分片异步，覆盖旧版） =====

function collectAllEvidenceFull(keywords) {

  return new Promise(function (resolve) {

    var byBook = [];

    var bookIdx = {};

    for (var bi = 0; bi < DATA.length; bi++) {

      var b = DATA[bi];

      bookIdx[b.name] = byBook.length;

      byBook.push({ book: b, pagesMap: {} });

    }

    var pagesList = [];

    for (var bi2 = 0; bi2 < DATA.length; bi2++) {

      var bk = DATA[bi2];

      for (var k = 0; k < bk.pages.length; k++) pagesList.push({ book: bk, pg: bk.pages[k] });

    }

    var idx = 0;

    var BATCH = 300; // 每片处理页数，分片让出主线程避免卡死

    function chunk() {

      var done = 0;

      while (idx < pagesList.length && done < BATCH) {

        var entry = pagesList[idx++];

        var pg = entry.pg;

        var text = pg.t || '';

        var hit = false;

        for (var q = 0; q < keywords.length; q++) { if (text.indexOf(keywords[q]) !== -1) { hit = true; break; } }

        if (hit) {

          var sents = splitSentences(text);

          var matched = [];

          for (var si = 0; si < sents.length; si++) {

            var ss = sents[si];

            var h2 = false;

            for (var q2 = 0; q2 < keywords.length; q2++) { if (ss.indexOf(keywords[q2]) !== -1) { h2 = true; break; } }

            if (h2) {

              if (ss.length < 15 && si + 1 < sents.length) ss += sents[si + 1];

              matched.push(ss);

            }

          }

          if (matched.length) {

            var bindex = bookIdx[entry.book.name];

            var pm = byBook[bindex].pagesMap;

            if (!pm[pg.p]) pm[pg.p] = [];

            pm[pg.p] = pm[pg.p].concat(matched);

          }

        }

        done++;

      }

      var statusEl = document.getElementById('status');

      if (statusEl) statusEl.textContent = '正在全库检索史料（' + idx + '/' + pagesList.length + '页）…';

      if (idx < pagesList.length) {

        setTimeout(chunk, 0);

      } else {

        var results = [];

        for (var bi3 = 0; bi3 < byBook.length; bi3++) {

          var item = byBook[bi3];

          var pkeys = Object.keys(item.pagesMap);

          if (!pkeys.length) continue;

          var items = [], count = 0, chars = 0;

          var sorted = pkeys.map(Number).sort(function (a, b) { return a - b; });

          for (var kk = 0; kk < sorted.length; kk++) {

            var page = String(sorted[kk]);

            var pageText = item.pagesMap[page].join(' ');

            count += item.pagesMap[page].length;

            chars += Math.min(pageText.length, 300);

            items.push({ page: page, text: pageText });

          }

          results.push({ book: item.book.name, count: count, chars: chars, pages: sorted, items: items });

        }

        resolve(results);

      }

    }

    setTimeout(chunk, 0);

  });

}



async function collectAndAnswer(question, apiKey, customSys, customUser) { await ensureData();

  if (customUser) {

    var csys = customSys || buildResearchSystem();

    return callThreadWithHistory(apiKey, csys, customUser, question);

  }

  var keywords = extractResearchKeywords(question);

  var sys = buildResearchSystem();

  var SINGLE_CAP = 40000;

  if (!keywords.length) {

    researchThread.evidences.push({ keywords: [], overview: [], noEvidence: true });

    var u0 = buildResearchUserContent(question, [], [], true);

    return callThreadWithHistory(apiKey, sys, u0, question);

  }

  return collectAllEvidenceFull(keywords).then(function (fullRes) {

    var totalChars = fullRes.reduce(function (s, r) { return s + r.chars; }, 0);

    var hasEvidence = fullRes.length > 0;

    var overview = fullRes.map(function (r) { return { book: r.book, count: r.count, pages: r.pages.length }; });

    researchThread.evidences.push({ keywords: keywords, overview: overview, noEvidence: !hasEvidence });

    if (!hasEvidence) {

      var u = buildResearchUserContent(question, keywords, [], true);

      return callThreadWithHistory(apiKey, sys, u, question);

    }

    if (totalChars <= SINGLE_CAP) {

      var body = [];

      for (var i = 0; i < fullRes.length; i++) {

        var r = fullRes[i];

        for (var j = 0; j < r.items.length; j++) {

          var it = r.items[j]; var t = it.text;

          if (t.length > 300) t = t.substring(0, 300) + '…';

          body.push('【《' + r.book + '》第' + it.page + '页】' + t);

        }

      }

      var u2 = '研究问题：' + question + '\n\n已尝试检索的关键词：' + keywords.join('、') + '\n\n【史料原文摘录】\n' + body.join('\n') + '\n\n请严格依据以上摘录回答，言必有据，每条结论注明出处，找不到的如实说没有。';

      return callThreadWithHistory(apiKey, sys, u2, question);

    }

    var batches = buildBatches(fullRes, 38000);

    var chain = Promise.resolve();

    var summaries = [];

    for (var bi = 0; bi < batches.length; bi++) {

      (function (batch) {

        chain = chain.then(function () {

          var bp = buildBatchResearchPrompt(question, batch);

          return callDeepSeekThread(apiKey, [{ role: 'system', content: bp.system }, { role: 'user', content: bp.user }]).then(function (s) { summaries.push(s); });

        });

      })(batches[bi]);

    }

    return chain.then(function () {

      var sp = buildSynthesizePrompt(question, summaries, keywords, true);

      return callThreadWithHistory(apiKey, sys, sp, question);

    });

  });

}
